<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบที่ 1 - คำนวณไพ่อัตโนมัติ v1.1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Kanit:wght@500;600;700&display=swap');

        body { font-family: 'Sarabun', sans-serif; background: #f4f6f9; text-align: center; padding: 20px; color: #333; margin: 0; }
        .container { max-width: 900px; margin: 20px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        
        h2 { color: #8e44ad; font-family: 'Kanit', sans-serif; font-size: 2.5em; margin-bottom: 10px; }
        .sub-title { color: #7f8c8d; margin-bottom: 30px; font-size: 1.2em; }

        .input-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; 
            margin-bottom: 30px; text-align: left; background: #ecf0f1; padding: 30px; border-radius: 15px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px;}
        .input-group label { font-family: 'Kanit', sans-serif; font-size: 1.2em; color: #2c3e50; font-weight: 600; }
        .input-group select { 
            padding: 15px; font-size: 1.1em; border-radius: 8px; border: 2px solid #bdc3c7; 
            font-family: 'Sarabun', sans-serif; outline: none; cursor: pointer; transition: 0.3s;
        }
        .input-group select:focus { border-color: #8e44ad; box-shadow: 0 0 8px rgba(142, 68, 173, 0.3); }

        .btn-calc { 
            background: #27ae60; color: white; padding: 18px; font-size: 1.4em; border: none; 
            border-radius: 10px; cursor: pointer; font-family: 'Kanit', sans-serif; font-weight: 700; 
            width: 100%; transition: 0.3s; box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4); margin-bottom: 30px;
        }
        .btn-calc:hover { background: #219a52; transform: translateY(-2px); }

        .result-section { display: none; text-align: left; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .export-box { 
            width: 100%; height: 180px; padding: 20px; font-family: monospace; font-size: 1.2em; 
            border: 2px dashed #8e44ad; border-radius: 10px; background: #fdfbfd; resize: none; 
            box-sizing: border-box; margin-bottom: 20px; color: #2c3e50; font-weight: 600;
        }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-action { 
            padding: 15px; border: none; color: white; border-radius: 8px; cursor: pointer; 
            font-weight: bold; font-size: 1.2em; font-family: 'Kanit', sans-serif; transition: 0.3s;
        }
        .btn-auto { background: #2980b9; grid-column: span 2;}
        .btn-auto:hover { background: #1f618d; }
        .btn-copy { background: #e67e22; }
        .btn-copy:hover { background: #d35400; }
        .btn-reset { background: #95a5a6; }
        .btn-reset:hover { background: #7f8c8d; }
        
        .status-text { color: #27ae60; font-weight: bold; text-align: center; margin-top: 10px; height: 20px;}

        @media (max-width: 768px) {
            .input-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚙️ ระบบคำนวณไพ่อัตโนมัติ</h2>
    <p class="sub-title">กรอกข้อมูล 4 ตำแหน่ง ระบบจะรันกระดานทั้งหมดให้คุณเอง</p>

    <div class="input-grid">
        <div class="input-group">
            <label>1. วันที่เกิด (1-31)</label>
            <select id="sel-date">
                <option value="" disabled selected>-- เลือกวันที่ --</option>
                <script>
                    for(let i=1; i<=31; i++) document.write(`<option value="${400+i}">วันที่ ${i}</option>`);
                </script>
            </select>
        </div>

        <div class="input-group">
            <label>2. วันเกิด (อาทิตย์-เสาร์)</label>
            <select id="sel-day">
                <option value="" disabled selected>-- เลือกวัน --</option>
                <option value="101">วันอาทิตย์ (1)</option>
                <option value="102">วันจันทร์ (2)</option>
                <option value="103">วันอังคาร (3)</option>
                <option value="104">วันพุธ (4)</option>
                <option value="105">วันพฤหัสบดี (5)</option>
                <option value="106">วันศุกร์ (6)</option>
                <option value="107">วันเสาร์ (7)</option>
            </select>
        </div>

        <div class="input-group">
            <label>3. เดือนเกิด (เดือน 1-12)</label>
            <select id="sel-month">
                <option value="" disabled selected>-- เลือกเดือน --</option>
                <option value="201">เดือน 1 (อ้าย) / ธันวาคม</option>
                <option value="202">เดือน 2 (ยี่) / มกราคม</option>
                <option value="203">เดือน 3 / กุมภาพันธ์</option>
                <option value="204">เดือน 4 / มีนาคม</option>
                <option value="205">เดือน 5 / เมษายน</option>
                <option value="206">เดือน 6 / พฤษภาคม</option>
                <option value="207">เดือน 7 / มิถุนายน</option>
                <option value="208">เดือน 8 / กรกฎาคม</option>
                <option value="209">เดือน 9 / สิงหาคม</option>
                <option value="210">เดือน 10 / กันยายน</option>
                <option value="211">เดือน 11 / ตุลาคม</option>
                <option value="212">เดือน 12 / พฤศจิกายน</option>
            </select>
        </div>

        <div class="input-group">
            <label>4. ปีนักษัตร (ปี 1-12)</label>
            <select id="sel-year">
                <option value="" disabled selected>-- เลือกปีนักษัตร --</option>
                <option value="301">ปี 1 / ชวด (หนู)</option>
                <option value="302">ปี 2 / ฉลู (วัว)</option>
                <option value="303">ปี 3 / ขาล (เสือ)</option>
                <option value="304">ปี 4 / เถาะ (กระต่าย)</option>
                <option value="305">ปี 5 / มะโรง (งูใหญ่)</option>
                <option value="306">ปี 6 / มะเส็ง (งูเล็ก)</option>
                <option value="307">ปี 7 / มะเมีย (ม้า)</option>
                <option value="308">ปี 8 / มะแม (แพะ)</option>
                <option value="309">ปี 9 / วอก (ลิง)</option>
                <option value="310">ปี 10 / ระกา (ไก่)</option>
                <option value="311">ปี 11 / จอ (หมา)</option>
                <option value="312">ปี 12 / กุน (หมู)</option>
            </select>
        </div>
    </div>

    <button class="btn-calc" onclick="calculateBoard()">✨ ประมวลผลรหัสไพ่</button>

    <div id="result-area" class="result-section">
        <h3 style="color: #2980b9; font-family: 'Kanit', sans-serif;">📋 รหัสข้อมูลสำเร็จรูป พร้อมส่งต่อ</h3>
        
        <textarea id="export-data" class="export-box" readonly></textarea>
        
        <div class="action-grid">
            <button class="btn-action btn-auto" onclick="sendToSystem2()">🚀 ส่งข้อมูลไปเปิดกระดาน (ระบบที่ 2)</button>
            <button class="btn-action btn-copy" onclick="copyData()">📋 คัดลอกข้อความ (Copy)</button>
            <button class="btn-action btn-reset" onclick="location.reload()">🔄 เริ่มคำนวณใหม่</button>
        </div>
        <div id="copy-status" class="status-text"></div>
    </div>
</div>

<script>
    // สร้างตารางกลุ่มไพ่ฐาน (12 กลุ่ม กลุ่มละ 3 ใบ)
    const GRAPH_GROUPS = {};
    for (let i = 1; i <= 12; i++) {
        GRAPH_GROUPS[i] = [400 + i, 400 + i + 12, 400 + i + 24];
    }

    // ฟังก์ชันรันลำดับเลขไพ่
    function generateSequence(startId, length, minId, maxId) {
        let seq = [];
        let curr = startId;
        for (let i = 0; i < length; i++) {
            seq.push(curr);
            curr++;
            if (curr > maxId) curr = minId;
        }
        return seq;
    }

    function calculateBoard() {
        const valDate = parseInt(document.getElementById('sel-date').value);
        const valDay = parseInt(document.getElementById('sel-day').value);
        const valMonth = parseInt(document.getElementById('sel-month').value);
        const valYear = parseInt(document.getElementById('sel-year').value);

        if (!valDate || !valDay || !valMonth || !valYear) {
            alert("กรุณาเลือกข้อมูลให้ครบทั้ง 4 ช่องครับ");
            return;
        }

        // 1. รันรหัสตั้งต้น
        const dateSeq = [valDate];
        const daySeq = generateSequence(valDay, 7, 101, 107);
        const monthSeq = generateSequence(valMonth, 12, 201, 212);
        const yearSeq = generateSequence(valYear, 12, 301, 312);

        // 2. คำนวณ GRAPH_BASE (12 ตำแหน่ง)
        let graphBase = [];
        let usedGraphCards = new Set();

        for (let i = 0; i < 12; i++) {
            // วัน(ตำแหน่ง 8-12 เป็น 0), เดือน, ปี
            let dVal = (i < 7) ? (daySeq[i] % 100) : 0; 
            let mVal = monthSeq[i] % 100;
            let yVal = yearSeq[i] % 100;

            let sum = dVal + mVal + yVal;
            let targetCard = 400 + sum;

            // เช็กชน (Collision)
            if (usedGraphCards.has(targetCard)) {
                let groupId = sum % 12 || 12; 
                let groupCards = GRAPH_GROUPS[groupId];
                
                // หาไพ่ที่ยังไม่ถูกใช้ในกลุ่ม (อาร์เรย์เรียงจากน้อยไปมากอยู่แล้ว)
                let availableCards = groupCards.filter(c => !usedGraphCards.has(c));
                if (availableCards.length > 0) {
                    targetCard = availableCards[0];
                }
            }
            
            usedGraphCards.add(targetCard);
            graphBase.push(targetCard);
        }

        // 3. คำนวณ SEVEN_BASE (7 ตำแหน่ง)
        let sevenBase = [];
        for (let i = 0; i < 7; i++) {
            let dVal = daySeq[i] % 100;
            // กฎ Modulo เลขเจ็ดตัว (เดือนและปี วน 1-7)
            let mVal = ((monthSeq[i] - 201) % 7) + 1; 
            let yVal = ((yearSeq[i] - 301) % 7) + 1;

            let sum = dVal + mVal + yVal;
            let targetCard = 400 + sum;
            sevenBase.push(targetCard);
        }

        // 4. สรุปผลเป็น Text
        let exportText = `DATE:${dateSeq.join(',')}\n`;
        exportText += `DAY:${daySeq.join(',')}\n`;
        exportText += `MONTH:${monthSeq.join(',')}\n`;
        exportText += `YEAR:${yearSeq.join(',')}\n`;
        exportText += `GRAPH_BASE:${graphBase.join(',')}\n`;
        exportText += `SEVEN_BASE:${sevenBase.join(',')}`;

        document.getElementById('export-data').value = exportText;
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('result-area').scrollIntoView({ behavior: 'smooth' });
    }

    function copyData() {
        const copyText = document.getElementById("export-data");
        copyText.select();
        copyText.setSelectionRange(0, 99999); 
        navigator.clipboard.writeText(copyText.value).then(() => {
            document.getElementById('copy-status').innerText = "✅ คัดลอกข้อมูลสำเร็จ!";
            setTimeout(() => { document.getElementById('copy-status').innerText = ""; }, 3000);
        });
    }

    function sendToSystem2() {
        const data = document.getElementById("export-data").value;
        localStorage.setItem('promyan_auto_data', data);
        // *แก้ไขชื่อไฟล์ 'system2.html' ให้ตรงกับชื่อไฟล์ระบบกระดานที่คุณหมอใช้อยู่ในเครื่องนะครับ*
        window.location.href = 'system2.html'; 
    }
</script>
</body>
</html>

    function getGraphGuideBaseColor(col) {
        const sourceCard = document.querySelector(`#main-board .card-item[data-row="5"][data-col="${col}"]`);
        if (!sourceCard) return '#3498db';
        for (const [className, color] of Object.entries(GRAPH_GUIDE_CARD_COLORS)) {
            if (sourceCard.classList.contains(className)) return color;
        }
        return '#3498db';
    }

    function graphGuideHexToRgb(hex) {
        const normalized = hex.replace('#', '');
        return {
            r: parseInt(normalized.slice(0, 2), 16),
            g: parseInt(normalized.slice(2, 4), 16),
            b: parseInt(normalized.slice(4, 6), 16)
        };
    }

    function graphGuideRgbToHex({ r, g, b }) {
        const toHex = value => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    function adjustGraphGuideColor(hex, amount) {
        const rgb = graphGuideHexToRgb(hex);
        const target = amount >= 0 ? 255 : 0;
        const factor = Math.abs(amount);
        return graphGuideRgbToHex({
            r: rgb.r + (target - rgb.r) * factor,
            g: rgb.g + (target - rgb.g) * factor,
            b: rgb.b + (target - rgb.b) * factor
        });
    }

    function isGraphGuideLightColor(hex) {
        const { r, g, b } = graphGuideHexToRgb(hex);
        return ((r * 299 + g * 587 + b * 114) / 255000) > 0.68;
    }

    function getGraphGuidePoint(boardRect, coordinate) {
        const [row, col] = coordinate.split(':');
        const card = document.querySelector(`#main-board .card-item[data-row="${row}"][data-col="${col}"]`);
        if (!card) return null;
        const rect = card.getBoundingClientRect();
        return {
            x: rect.left - boardRect.left + rect.width / 2,
            y: rect.top - boardRect.top + rect.height / 2
        };
    }

    function offsetGraphGuidePoints(points, offset) {
        if (!offset) return points.map(point => ({ ...point }));
        return points.map((point, index) => {
            const previous = points[Math.max(0, index - 1)];
            const next = points[Math.min(points.length - 1, index + 1)];
            const dx = next.x - previous.x;
            const dy = next.y - previous.y;
            const length = Math.hypot(dx, dy) || 1;
            return {
                x: point.x + (-dy / length) * offset,
                y: point.y + (dx / length) * offset
            };
        });
    }

    function appendGraphGuidePolyline(svg, points, color) {
        const pointText = points.map(point => `${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(' ');
        const common = {
            points: pointText, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
            'vector-effect': 'non-scaling-stroke'
        };
        svg.appendChild(createGraphGuideSvgElement('polyline', {
            ...common, stroke: '#ffffff', 'stroke-width': 9, 'stroke-opacity': 0.58
        }));
        svg.appendChild(createGraphGuideSvgElement('polyline', {
            ...common, stroke: isGraphGuideLightColor(color) ? '#2c3e50' : '#ffffff',
            'stroke-width': 6, 'stroke-opacity': isGraphGuideLightColor(color) ? 0.82 : 0.5
        }));
        svg.appendChild(createGraphGuideSvgElement('polyline', {
            ...common, stroke: color, 'stroke-width': 3.8, 'stroke-opacity': 0.98
        }));
    }

    function appendGraphGuideNode(svg, point, colors) {
        const distinctColors = [...new Set(colors)];
        const radius = 6;
        svg.appendChild(createGraphGuideSvgElement('circle', {
            cx: point.x, cy: point.y, r: 9, fill: '#ffffff', 'fill-opacity': 0.78
        }));

        if (distinctColors.length === 1) {
            const color = distinctColors[0];
            svg.appendChild(createGraphGuideSvgElement('circle', {
                cx: point.x, cy: point.y, r: radius, fill: color,
                stroke: isGraphGuideLightColor(color) ? '#2c3e50' : '#ffffff', 'stroke-width': 2,
                'vector-effect': 'non-scaling-stroke'
            }));
            return;
        }

        const [firstColor, secondColor] = distinctColors;
        svg.appendChild(createGraphGuideSvgElement('circle', {
            cx: point.x, cy: point.y, r: radius, fill: firstColor
        }));
        const rightHalf = `M ${point.x} ${point.y - radius} A ${radius} ${radius} 0 0 1 ${point.x} ${point.y + radius} L ${point.x} ${point.y} Z`;
        svg.appendChild(createGraphGuideSvgElement('path', { d: rightHalf, fill: secondColor }));
        svg.appendChild(createGraphGuideSvgElement('circle', {
            cx: point.x, cy: point.y, r: radius, fill: 'none', stroke: '#2c3e50',
            'stroke-width': 1.6, 'vector-effect': 'non-scaling-stroke'
        }));
    }

    function appendGraphGuideSourceRings(svg, point, color) {
        const ringRadii = [16, 21];
        ringRadii.forEach((radius, index) => {
            const common = {
                cx: point.x, cy: point.y, r: radius, fill: 'none',
                'vector-effect': 'non-scaling-stroke'
            };
            svg.appendChild(createGraphGuideSvgElement('circle', {
                ...common, stroke: '#ffffff', 'stroke-width': 7, 'stroke-opacity': 0.62
            }));
            if (isGraphGuideLightColor(color)) {
                svg.appendChild(createGraphGuideSvgElement('circle', {
                    ...common, stroke: '#2c3e50', 'stroke-width': 5, 'stroke-opacity': 0.82
                }));
            }
            svg.appendChild(createGraphGuideSvgElement('circle', {
                ...common, stroke: color, 'stroke-width': 3,
                'stroke-opacity': index === 0 ? 1 : 0.86
            }));
        });
    }

    function renderGraphDiagonalGuides() {
        graphGuideRenderFrame = null;
        removeGraphDiagonalGuides();
        if (graphHighlightMode !== 'diagonal' || activeGraphHighlightCols.length === 0) return;

        const board = document.getElementById('main-board');
        const boardRect = board.getBoundingClientRect();
        if (!boardRect.width || !boardRect.height) return;

        const pathData = activeGraphHighlightCols.slice(-2).map(col => {
            const coordinates = GRAPH_DIAGONAL_PATHS[col] || [];
            const points = coordinates.map(coordinate => getGraphGuidePoint(boardRect, coordinate));
            if (points.some(point => !point)) return null;
            return { col, coordinates, points, color: getGraphGuideBaseColor(col) };
        }).filter(Boolean);
        if (pathData.length === 0) return;

        if (pathData.length === 2 && pathData[0].color.toLowerCase() === pathData[1].color.toLowerCase()) {
            pathData[1].color = adjustGraphGuideColor(
                pathData[1].color,
                isGraphGuideLightColor(pathData[1].color) ? -0.28 : 0.28
            );
        }

        const svg = createGraphGuideSvgElement('svg', {
            class: 'graph-diagonal-overlay', viewBox: `0 0 ${boardRect.width} ${boardRect.height}`,
            width: boardRect.width, height: boardRect.height, 'aria-hidden': 'true', preserveAspectRatio: 'none'
        });

        pathData.forEach((path, index) => {
            const offset = pathData.length === 2 ? (index === 0 ? -3.2 : 3.2) : 0;
            appendGraphGuidePolyline(svg, offsetGraphGuidePoints(path.points, offset), path.color);
        });

        const nodeMap = new Map();
        pathData.forEach((path, pathIndex) => {
            path.coordinates.forEach((coordinate, pointIndex) => {
                if (!nodeMap.has(coordinate)) {
                    nodeMap.set(coordinate, { point: path.points[pointIndex], pathIndexes: new Set() });
                }
                nodeMap.get(coordinate).pathIndexes.add(pathIndex);
            });
        });
        nodeMap.forEach(node => {
            const colors = [...node.pathIndexes].map(index => pathData[index].color);
            appendGraphGuideNode(svg, node.point, colors);
        });

        pathData.forEach(path => {
            const sourceCoordinate = `5:${path.col}`;
            const sourceIndex = path.coordinates.indexOf(sourceCoordinate);
            if (sourceIndex >= 0) appendGraphGuideSourceRings(svg, path.points[sourceIndex], path.color);
        });

        board.appendChild(svg);
    }

    function scheduleGraphDiagonalGuides() {
        if (graphGuideRenderFrame !== null) cancelAnimationFrame(graphGuideRenderFrame);
        graphGuideRenderFrame = requestAnimationFrame(renderGraphDiagonalGuides);
    }

    window.addEventListener('resize', scheduleGraphDiagonalGuides);
    if (document.fonts?.ready) document.fonts.ready.then(scheduleGraphDiagonalGuides);

    function applyGraphHighlights() {
        const board = document.getElementById('main-board');
        const targets = document.querySelectorAll('.dim-target-graph');
        if (activeGraphHighlightCols.length === 0) {
            board.classList.remove('has-graph-highlight');
            targets.forEach(el => el.classList.remove('highlighted'));
            removeGraphDiagonalGuides();
            return;
        }

        board.classList.add('has-graph-highlight');
        const diagonalCoordinates = new Set();
        if (graphHighlightMode === 'diagonal') {
            activeGraphHighlightCols.forEach(col => {
                (GRAPH_DIAGONAL_PATHS[col] || []).forEach(coordinate => diagonalCoordinates.add(coordinate));
            });
        }

        targets.forEach(el => {
            const row = parseInt(el.dataset.row, 10);
            const coordinate = `${row}:${el.dataset.col}`;
            const isHighlighted = graphHighlightMode === 'diagonal'
                ? diagonalCoordinates.has(coordinate)
                : activeGraphHighlightCols.includes(el.dataset.col) && row !== 7;
            el.classList.toggle('highlighted', isHighlighted);
        });
        renderGraphDiagonalGuides();
    }

    function setGraphHighlightMode(mode) {
        if (mainViewMode === 'seven') return;
        if (mode !== 'vertical' && mode !== 'diagonal') return;
        graphHighlightMode = mode;
        if (graphHighlightMode === 'diagonal' && activeGraphHighlightCols.length > 2) {
            activeGraphHighlightCols = activeGraphHighlightCols.slice(-2);
        }
        applyGraphModeControls();
        applyGraphHighlights();
    }

    function toggleGraphHighlight(col) {
        if (mainViewMode === 'seven') return;
        clearSevenHighlight();
        const colStr = String(col);
        const maxGraphPositions = graphHighlightMode === 'vertical' ? 3 : 2;
        updatePositionSelection(activeGraphHighlightCols, colStr, maxGraphPositions);
        sevenLabelsVisible = false;
        applySevenLabelVisibility();
        applyGraphHighlights();
    }

    function toggleSevenHighlight(col, sourceCard = null) {
        const board = document.getElementById('main-board');
        clearGraphHighlight();
        sevenLabelsVisible = true;
        applySevenLabelVisibility();

        const colStr = String(col);
        const previousCols = [...activeSevenCols];
        const wasSelected = previousCols.includes(colStr);
        updatePositionSelection(activeSevenCols, colStr, 2);

        const activeColSet = new Set(activeSevenCols);
        document.querySelectorAll('.seven-source-selected').forEach(card => {
            const markerCol = String(card.dataset.sevenSourceCol || '');
            if (!activeColSet.has(markerCol) || markerCol === colStr) {
                card.classList.remove('seven-source-selected');
                delete card.dataset.sevenSourceCol;
            }
        });
        if (sourceCard && !wasSelected && activeColSet.has(colStr)) {
            sourceCard.classList.add('seven-source-selected');
            sourceCard.dataset.sevenSourceCol = colStr;
        }

        if (activeSevenCols.length === 0) {
            board.classList.remove('has-seven-highlight');
            document.querySelectorAll('.dim-target-seven').forEach(el => {
                el.classList.remove('highlighted');
                if (el.matches('[data-nine-number]')) {
                    el.querySelectorAll('.nine-base-cell').forEach(button => button.setAttribute('aria-pressed', 'false'));
                }
            });
            return;
        }

        board.classList.add('has-seven-highlight');
        const activeGroups = [];

        activeSevenCols.forEach(c => {
            const leader = document.querySelector(`.dim-target-seven[data-row="4"][data-col="${c}"]`);
            const group = leader ? CARD_GROUPS[leader.dataset.code] : null;
            if (group && !activeGroups.includes(group)) activeGroups.push(group);
        });

        document.querySelectorAll('.dim-target-seven').forEach(el => {
            const row = parseInt(el.dataset.row, 10);
            let isHigh = false;
            if (el.matches('[data-nine-number]')) {
                isHigh = activeGroups.includes(Number(el.dataset.nineNumber));
                el.querySelectorAll('.nine-base-cell').forEach(button => button.setAttribute('aria-pressed', String(isHigh)));
            } else if ([4, 7, 9].includes(row) && activeSevenCols.includes(String(el.dataset.col))) isHigh = true;
            else if ([2, 3].includes(row) && activeGroups.includes(CARD_GROUPS[el.dataset.code]) && el.dataset.hasTitle === "true") isHigh = true;
            el.classList.toggle('highlighted', isHigh);
        });
    }

    function toggleSevenGroupFromCard(card) {
        if (mainViewMode !== 'seven' || !card) return;
        const targetNumber = CARD_GROUPS[String(card.dataset.code)];
        if (!Number.isInteger(targetNumber)) return;
        const leaders = Array.from(document.querySelectorAll('.dim-target-seven[data-row="4"][data-has-title="true"]'));
        const leader = leaders.find(item => CARD_GROUPS[item.dataset.code] === targetNumber);
        if (!leader) return;
        toggleSevenHighlight(Number(leader.dataset.col), card);
    }

    function toggleNineBaseNumber(number) {
        if (mainViewMode !== 'seven') return;
        const targetNumber = Number(number);
        const leaders = Array.from(document.querySelectorAll('.dim-target-seven[data-row="4"][data-has-title="true"]'));
        const leader = leaders.find(card => CARD_GROUPS[card.dataset.code] === targetNumber);
        if (!leader) return;
        toggleSevenHighlight(Number(leader.dataset.col));
    }

    function getGraph12SourceStyleClass(index, code) {
        const supportedClasses = [
            "card-default", "card-very-good", "card-good", "card-neutral-status", "card-bad",
            "card-very-bad", "card-dark-gray", "card-black", "card-red", "card-gold-zone"
        ];
        const sourceCard = document.querySelector(`#main-board .card-item[data-row="5"][data-col="${index + 2}"]`);
        if (sourceCard) {
            const sourceClass = supportedClasses.find(className => sourceCard.classList.contains(className));
            if (sourceClass) return sourceClass;
        }
        return getCardStyleClass(code, ROW_8_TITLES[index]);
    }

    function renderGraph12Cards() {
        const cardArea = document.getElementById('graph12-card-area');
        cardArea.innerHTML = "";

        currentBoardData.GRAPH_BASE.forEach((code, index) => {
            const title = GRAPH12_TITLES[index];
            const styleClass = getGraph12SourceStyleClass(index, code);
            const card = document.createElement('article');
            card.className = `card-item graph12-card ${styleClass} ${GRAPH12_LAYOUT_CLASSES[index]}`;
            card.dataset.pos = title;
            card.dataset.code = String(code);
            card.dataset.graphIndex = String(index);
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', `${title} ไพ่หมายเลข ${code}`);
            card.onclick = () => handleGraph12CardClick(title);
            card.onkeydown = event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    handleGraph12CardClick(title);
                }
            };
            card.innerHTML = `
                <span class="graph12-link-badge" aria-hidden="true">🔗</span>
                <span class="pos-label">${title}</span>
                <img src="images/${code}.jpg" onerror="this.src='images/back.jpg';" alt="ไพ่ตำแหน่ง${title}">
            `;
            cardArea.appendChild(card);
        });
    }

    function getGraph12AgeState() {
        if (!currentBoardData) return { baseAge: 0, selectedAge: 0 };
        const baseAge = Number(currentBoardData.BASE_AGE ?? currentBoardData.AGE ?? 0);
        const selectedAge = Number(currentBoardData.SELECTED_AGE ?? baseAge);
        return { baseAge, selectedAge };
    }

    function renderGraph12AgeControls() {
        const container = document.getElementById('graph12-age-controls');
        if (!container) return;
        const { baseAge, selectedAge } = getGraph12AgeState();
        container.innerHTML = '';

        if (!Number.isInteger(baseAge) || baseAge <= 0) {
            container.innerHTML = '<div class="graph12-age-message">กรุณาระบุปี พ.ศ. เกิด เพื่อแสดงตำแหน่งอายุ</div>';
            return;
        }

        for (let offset = 0; offset < 12; offset++) {
            const age = baseAge + offset;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'graph12-age-button';
            button.textContent = String(age);
            button.title = age === baseAge ? `อายุปัจจุบัน ${age} ปี` : `ดูอายุ ${age} ปี`;
            button.setAttribute('aria-label', button.title);
            button.classList.toggle('is-current', age === baseAge);
            button.classList.toggle('is-selected', age === selectedAge);
            button.setAttribute('aria-pressed', String(age === selectedAge));
            button.onclick = () => selectGraph12Age(age);
            container.appendChild(button);
        }
    }

    function applyGraph12AgeOverlay() {
        document.querySelectorAll('#graph12-card-area .graph12-age-overlay').forEach(overlay => overlay.remove());
        document.querySelectorAll('#graph12-card-area .graph12-card').forEach(card => card.classList.remove('has-age'));
        updateGraph12AgeToggle();
        if (!graph12AgeVisible) return;

        const { selectedAge } = getGraph12AgeState();
        if (!Number.isInteger(selectedAge) || selectedAge <= 0) return;
        const graphIndex = (selectedAge - 1) % 12;
        const targetCard = document.querySelector(`#graph12-card-area .graph12-card[data-graph-index="${graphIndex}"]`);
        if (!targetCard) return;

        const overlay = document.createElement('span');
        overlay.className = 'graph12-age-overlay';
        overlay.textContent = String(selectedAge);
        overlay.setAttribute('aria-label', `อายุ ${selectedAge} ปี`);
        targetCard.classList.add('has-age');
        targetCard.appendChild(overlay);
    }

    function updateGraph12AgeToggle() {
        const button = document.getElementById('graph12-age-toggle');
        if (!button) return;
        button.classList.toggle('is-hidden', !graph12AgeVisible);
        button.setAttribute('aria-pressed', String(graph12AgeVisible));
        button.title = graph12AgeVisible ? 'ปิดการแสดงอายุบนไพ่' : 'เปิดการแสดงอายุบนไพ่';
    }

    function toggleGraph12AgeVisibility() {
        graph12AgeVisible = !graph12AgeVisible;
        applyGraph12AgeOverlay();
    }

    function selectGraph12Age(age) {
        selectPredictionAge(age);
    }

    function updateGraph12Controls() {
        document.querySelectorAll('.graph12-day-button').forEach(button => {
            const isActive = button.dataset.graph12Day === activeGraph12Day;
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', String(isActive));
        });

        document.querySelectorAll('.graph12-filter-button').forEach(button => {
            const isActive = button.dataset.graph12Filter === activeGraph12Filter;
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', String(isActive));
        });

        const activeDayLabel = GRAPH12_DAY_LABELS[activeGraph12Day] || "-";
        const birthDayLabel = GRAPH12_DAY_LABELS[graph12BirthDay] || "-";
        const caption = activeGraph12Day === graph12BirthDay
            ? `วันเกิดเจ้าชะตา: ${birthDayLabel} — แสดงความสัมพันธ์ตามวันเกิดอัตโนมัติ`
            : `วันเกิดเจ้าชะตา: ${birthDayLabel} — กำลังดูความสัมพันธ์: ${activeDayLabel}`;
        document.getElementById('graph12-caption').textContent = caption;
    }

    function applyGraph12Display() {
        const groups = GRAPH12_RELATION_GROUPS[activeGraph12Day] || [];
        const linkablePositions = new Set(groups.flat());
        const cards = document.querySelectorAll('#graph12-card-area .graph12-card');

        cards.forEach(card => {
            const position = card.dataset.pos;
            const status = getCardBaseStatus(card.dataset.code);
            card.classList.remove('is-linkable', 'is-linked', 'is-dimmed');
            card.classList.toggle('is-linkable', linkablePositions.has(position));

            if (activeGraph12Group) {
                if (activeGraph12Group.includes(position)) card.classList.add('is-linked');
                else card.classList.add('is-dimmed');
            } else if (activeGraph12Filter === 'good') {
                if (status !== 'VG' && status !== 'G') card.classList.add('is-dimmed');
            } else if (activeGraph12Filter === 'bad') {
                if (status !== 'VB' && status !== 'B') card.classList.add('is-dimmed');
            }
        });

        updateGraph12Controls();
    }

    function setGraph12Day(day) {
        if (!GRAPH12_RELATION_GROUPS[day]) return;
        activeGraph12Day = day;
        activeGraph12Group = null;
        activeGraph12Filter = 'reset';
        applyGraph12Display();
    }

    function handleGraph12CardClick(position) {
        const groups = GRAPH12_RELATION_GROUPS[activeGraph12Day] || [];
        const targetGroup = groups.find(group => group.includes(position));
        if (!targetGroup) return;
        activeGraph12Group = targetGroup;
        activeGraph12Filter = 'reset';
        applyGraph12Display();
    }

    function filterGraph12Cards(type) {
        if (!['good', 'bad', 'reset'].includes(type)) return;
        activeGraph12Filter = type;
        activeGraph12Group = null;
        applyGraph12Display();
    }

    function openGraph12View() {
        if (mainViewMode === 'seven') return;
        if (!currentBoardData || !Array.isArray(currentBoardData.GRAPH_BASE) || currentBoardData.GRAPH_BASE.length !== 12) {
            alert('กรุณาประมวลผลและสร้างกระดานก่อนเปิดฐานกราฟ12ใบ');
            return;
        }

        graph12BirthDay = GRAPH12_DAY_BY_CODE[String(currentBoardData.DAY[0])] || 'Sun';
        activeGraph12Day = graph12BirthDay;
        activeGraph12Group = null;
        activeGraph12Filter = 'reset';
        renderGraph12Cards();
        renderGraph12AgeControls();
        applyGraph12Display();
        applyGraph12AgeOverlay();

        document.getElementById('main-app-view').hidden = true;
        document.getElementById('graph12-view').hidden = false;
        scheduleLayoutScaleRefresh();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeGraph12View() {
        document.getElementById('graph12-view').hidden = true;
        document.getElementById('main-app-view').hidden = false;
        scheduleLayoutScaleRefresh();
        document.getElementById('main-wrapper').scrollIntoView({ behavior: 'smooth' });
    }

    function waitForGraph12Images(target) {
        const images = Array.from(target.querySelectorAll('img'));
        return Promise.all(images.map(img => {
            if (img.complete) return Promise.resolve();
            return new Promise(resolve => {
                img.addEventListener('load', resolve, { once: true });
                img.addEventListener('error', resolve, { once: true });
            });
        }));
    }

    function saveGraph12AsImage() {
        if (typeof html2canvas !== 'function') {
            alert('ไม่สามารถโหลดระบบบันทึกภาพได้ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่');
            return;
        }

        const target = document.getElementById('graph12-capture');
        const saveButton = document.getElementById('graph12-save-button');
        const restoreScale = prepareFullScaleCapture('graph12-capture', 'graph12-capture-wrapper', graph12LayoutScale);
        saveButton.disabled = true;
        saveButton.textContent = 'กำลังบันทึกภาพ...';

        waitForGraph12Images(target)
            .then(() => html2canvas(target, { scale: 2, backgroundColor: '#ffffff', useCORS: true }))
            .then(canvas => {
                const link = document.createElement('a');
                const dayLabel = GRAPH12_DAY_LABELS[activeGraph12Day] || 'วันเกิด';
                link.download = `ฐานกราฟ12ใบ-${dayLabel}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            })
            .catch(() => alert('ไม่สามารถบันทึกภาพได้ กรุณาลองใหม่อีกครั้ง'))
            .finally(() => {
                restoreScale();
                saveButton.disabled = false;
                saveButton.textContent = 'บันทึกเป็นภาพ';
            });
    }

    function updateDropdown(sel) { let val = sel.value; let p = sel.parentElement; if (val) { p.style.backgroundColor = NUMBER_COLORS[val].bg; sel.style.color = NUMBER_COLORS[val].color; } else { p.style.backgroundColor = "#293A4B"; sel.style.color = "transparent"; } }

    function saveAsImage() {
        if (typeof html2canvas !== 'function') {
            alert('ไม่สามารถโหลดระบบบันทึกภาพได้ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่');
            return;
        }
        const target = document.getElementById('export-area');
        const restoreScale = prepareFullScaleCapture('export-area', 'main-wrapper', mainBoardScale);
        document.querySelectorAll('.number-dropdown, .manual-input, .client-info-box').forEach(el => {
            let span = document.createElement('span'); span.className = 'temp-span';
            if (el.classList.contains('client-info-box')) { span.innerText = el.value || (el.placeholder ? el.placeholder : " "); span.style.cssText = "color:#FFFFFF; font-weight:bold; font-size:1.4vw; font-family:'Sarabun', sans-serif; display:block; padding:10px 15px;"; } 
            else { span.innerText = el.value || ""; span.style.cssText = `color:${el.style.color}; font-weight:900; font-size:1.6vw; font-family:'Sarabun', sans-serif; display:flex; align-items:center; justify-content:center; width:100%; height:100%;`; }
            el.style.display = 'none'; el.parentNode.appendChild(span);
        });

        renderGraphDiagonalGuides();
        html2canvas(target, { scale: 2, backgroundColor: "#293A4B", useCORS: true }).then(canvas => {
            let link = document.createElement('a'); link.download = 'กราฟชีวิต-หมอวิทยา.png'; link.href = canvas.toDataURL(); link.click();
        }).catch(() => {
            alert('ไม่สามารถบันทึกภาพได้ กรุณาลองใหม่อีกครั้ง');
        }).finally(() => {
            document.querySelectorAll('.temp-span').forEach(s => s.remove());
            document.querySelectorAll('.number-dropdown, .manual-input, .client-info-box').forEach(el => el.style.display = 'block');
            restoreScale();
            scheduleGraphDiagonalGuides();
        });
    }

    function saveToDatabase() {
        const name = document.getElementById('db-name').value; const dob = document.getElementById('db-dob').value; const note = document.getElementById('db-note').value;
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx_R3rj6uQExK1lFQnIA5V51gYrqzIJW7VrpyLO_7I6gbc1oFk8C5S62j_hljIHwmA9/exec"; 
        fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ timestamp: new Date().toLocaleString("th-TH"), name: name, dob: dob, note: note }) }).then(() => alert("☁️ บันทึกประวัติลูกค้าลง Google Sheet เรียบร้อยแล้วครับ!"));
    }

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กระดานพยากรณ์ กราฟชีวิต & เลขเจ็ดตัว 9 ฐาน V8 (หมอวิทยา ธรรมนาย)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* ========================================================================== */
        /* =================== ส่วนที่ 1: CSS (การตกแต่งและดีไซน์) ==================== */
        /* ========================================================================== */
        
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=Kanit:wght@500;600;700&display=swap');

        body { font-family: 'Sarabun', sans-serif; background: #fdfdfd; margin: 0; padding: 10px; text-align: center; }
        .container { width: 98%; max-width: 100%; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); box-sizing: border-box;}
        h2 { color: #8e44ad; font-family: 'Kanit', sans-serif; margin-bottom: 5px; font-size: 2.5em; font-weight: 700;}
        .sub-title { color: #7f8c8d; margin-bottom: 25px; font-size: 1.2em; }

        .input-section { background: #f8f9fa; padding: 16px; border-radius: 15px; border: 2px dashed #bdc3c7; margin-bottom: 18px; }
        .control-panel { display: grid; grid-template-columns: 1fr; gap: 10px; align-items: start; }
        .control-panel.has-actions { grid-template-columns: minmax(0, 1fr) minmax(320px, 360px); }
        .input-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px 10px; text-align: left; align-content: start;}
        .input-group { display: flex; flex-direction: column; gap: 4px; min-width: 0;}
        .input-group label { font-family: 'Kanit', sans-serif; font-size: 0.86em; color: #2c3e50; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .input-group select, .input-group input { min-width: 0; padding: 8px; font-size: 0.98em; border-radius: 8px; border: 1px solid #bdc3c7; font-family: 'Sarabun', sans-serif; outline: none; transition: 0.3s;}
        .input-group select:focus, .input-group input:focus { border-color: #8e44ad; box-shadow: 0 0 8px rgba(142, 68, 173, 0.3); }

        .input-action-group { justify-content: flex-end; }
        .btn-calc { background: #2980b9; color: white; min-height: 40px; padding: 8px 12px; font-size: 1.03em; border: none; border-radius: 8px; cursor: pointer; font-family: 'Kanit', sans-serif; font-weight: 700; width: 100%; transition: 0.3s; box-shadow: 0 4px 10px rgba(41, 128, 185, 0.3);}
        .btn-calc:hover { background: #1f618d; transform: translateY(-2px); }
        .save-controls { min-width: 0; display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, auto); gap: 6px; align-content: start;}
        .save-controls .layout-scale-control { grid-column: auto; }
        .btn-save { width: 100%; min-width: 0; min-height: 34px; padding: 7px 8px; font-size: 0.9em; line-height: 1.15; border: none; border-radius: 8px; cursor: pointer; font-family: 'Kanit', sans-serif; font-weight: 600; transition: 0.3s; color: white; white-space: nowrap;}
        .btn-save-image { background: #27ae60; } .btn-save-image:hover { background: #2ecc71; transform: translateY(-1px); }
        .btn-reset-row { background: #e74c3c; } .btn-reset-row:hover { background: #c0392b; transform: translateY(-1px); }
        .btn-db { background: #8e44ad; } .btn-db:hover { background: #732d91; transform: translateY(-1px); }
        .btn-graph12 { background: #d68910; } .btn-graph12:hover { background: #b9770e; transform: translateY(-1px); }

        .layout-scale-control {
            display: flex; align-items: center; justify-content: space-between; gap: 7px;
            min-width: 0; padding: 5px 7px; border: 1px solid #a9cce3; border-radius: 8px;
            background: #eaf2f8; color: #1b4f72; box-sizing: border-box;
        }
        .layout-scale-label { font-family: 'Kanit', sans-serif; font-size: 0.86em; font-weight: 700; white-space: nowrap; }
        .layout-scale-select {
            min-width: 68px; padding: 3px 5px; border: 1px solid #7fb3d5; border-radius: 6px;
            background: #ffffff; color: #1b4f72; cursor: pointer;
            font-family: 'Sarabun', sans-serif; font-size: 0.92em; font-weight: 800;
        }

        .main-view-mode-switch {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px;
            min-width: 0; min-height: 34px; padding: 3px; border: 1px solid #a9cce3;
            border-radius: 8px; background: #eaf2f8; box-sizing: border-box;
        }
        .main-view-mode-button {
            min-width: 0; padding: 4px 5px; border: none; border-radius: 6px;
            background: transparent; color: #566573; cursor: pointer;
            font-family: 'Kanit', sans-serif; font-size: 0.78em; font-weight: 700;
            line-height: 1.1; white-space: nowrap;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        .main-view-mode-button:hover { background: rgba(255,255,255,0.8); }
        .main-view-mode-button.is-active[data-main-view-mode="combined"] {
            background: #8e44ad; color: #ffffff; box-shadow: 0 2px 5px rgba(142,68,173,0.28);
        }
        .main-view-mode-button.is-active[data-main-view-mode="seven"] {
            background: #117864; color: #ffffff; box-shadow: 0 2px 5px rgba(17,120,100,0.28);
        }

        .export-container { background: #293A4B; padding: 25px; border-radius: 15px; width: 100%; box-sizing: border-box; position: relative; margin: 0 auto;}
        .board-wrapper { width: 100%; text-align: center; display: none; position: relative; overflow: visible; transition: height 0.28s ease; }
        .scaled-layout-target { transform-origin: top center; transition: transform 0.28s ease; }
        .graph12-capture-wrapper { width: 100%; position: relative; overflow: visible; transition: height 0.28s ease; }
        
        .grid-board { 
            display: grid; 
            grid-template-columns: repeat(14, 1fr); 
            row-gap: 15px;      
            column-gap: 30px;   
            width: 100%;
            position: relative;
            isolation: isolate;
        }

        .graph-diagonal-overlay {
            position: absolute; inset: 0; width: 100%; height: 100%;
            overflow: visible; pointer-events: none; z-index: 30;
        }
        .graph-diagonal-overlay * { pointer-events: none; }

        .card-item { border-radius: 8px; padding: 3px; border: 1px solid rgba(255,255,255,0.2); text-align: center; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative;}
        .card-item img { width: 100%; height: auto; border-radius: 5px; display: block; background: #fff;}
        
        .pos-label {
            display: block; min-height: 1.25em; margin-bottom: 4px; padding: 0 1px 2px;
            border-bottom: 1px solid rgba(0,0,0,0.1); font-family: 'Sarabun', sans-serif;
            font-size: clamp(10px, 0.82vw, 16px); font-weight: 700; line-height: 1.2;
            white-space: nowrap; word-break: keep-all; overflow: visible;
        }

        .card-default .pos-label, .card-good .pos-label, .card-neutral-status .pos-label { color: #2c3e50 !important; border-bottom-color: rgba(0,0,0,0.15) !important; }
        .card-default .pos-label.label-danger, .card-good .pos-label.label-danger, .card-neutral-status .pos-label.label-danger { color: #d32f2f !important; }
        .card-very-good .pos-label, .card-bad .pos-label, .card-very-bad .pos-label, .card-dark-gray .pos-label, .card-black .pos-label, .card-red .pos-label, .card-gold-zone .pos-label { color: #ffffff !important; border-bottom-color: rgba(255,255,255,0.3) !important; }

        .card-default { background-color: #f2f4f4 !important; }
        .card-very-good { background-color: #0047AB !important; }
        .card-good { background-color: #bbdefb !important; }
        .card-neutral-status { background-color: #ffffff !important; }
        .card-bad { background-color: #212121 !important; }
        .card-very-bad { background-color: #b71c1c !important; }
        .card-dark-gray { background-color: #424949 !important; }
        .card-black { background-color: #17202a !important; }
        .card-red { background-color: #cb4335 !important; }
        .card-gold-zone { background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c) !important; box-shadow: 0 4px 15px rgba(170, 119, 28, 0.5); }

        .r5-filter-controls {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: clamp(10px, 1.2vw, 18px); align-self: stretch;
        }
        .r5-filter-button {
            width: clamp(24px, 2.4vw, 36px); height: clamp(24px, 2.4vw, 36px);
            padding: 0; border: 1.5px solid #ffffff; border-radius: 50%;
            cursor: pointer; -webkit-appearance: none; appearance: none;
            box-shadow: 0 2px 7px rgba(0,0,0,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease, outline 0.2s ease;
        }
        .r5-filter-button.good { background-color: #bbdefb; }
        .r5-filter-button.bad { background-color: #b71c1c; }
        .r5-filter-button:hover { transform: scale(1.12); box-shadow: 0 4px 12px rgba(255,255,255,0.35); }
        .r5-filter-button.is-active { outline: 2px solid #ffffff; outline-offset: 3px; transform: scale(1.08); box-shadow: 0 0 14px rgba(255,255,255,0.75); }
        .card-item.r5-filter-dimmed { opacity: 0.14 !important; filter: grayscale(85%) !important; }

        .board-mode-controls, .seven-label-controls {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: clamp(10px, 1.2vw, 18px); align-self: stretch;
        }
        .board-control-button {
            width: clamp(24px, 2.4vw, 36px); height: clamp(24px, 2.4vw, 36px);
            padding: 0; border: 1.5px solid #ffffff; border-radius: 50%;
            cursor: pointer; -webkit-appearance: none; appearance: none;
            display: flex; align-items: center; justify-content: center;
            background-color: #566573; color: #ffffff;
            font-family: 'Sarabun', sans-serif; font-size: clamp(13px, 1.3vw, 20px); font-weight: 800;
            line-height: 1; box-shadow: 0 2px 7px rgba(0,0,0,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease, outline 0.2s ease, opacity 0.2s ease;
        }
        .board-control-button:hover { transform: scale(1.12); box-shadow: 0 4px 12px rgba(255,255,255,0.35); }
        .board-control-button.is-active { outline: 2px solid #ffffff; outline-offset: 3px; transform: scale(1.08); box-shadow: 0 0 14px rgba(255,255,255,0.75); }
        .graph-mode-button.vertical { background-color: #2471a3; }
        .graph-mode-button.diagonal { background-color: #8e44ad; }
        .seven-label-toggle { background-color: #117864; }
        .seven-label-toggle:not(.is-active) { background-color: #b71c1c; opacity: 1; }
        .grid-board.hide-seven-labels .seven-position-label { display: none !important; }

        .teacher-watermark { font-size: 1.1vw; color: #f1c40f; font-family: 'Sarabun', sans-serif; font-weight: bold; text-align: right; margin-top: -5px; }
        .teacher-overlay-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; text-align: center; color: rgba(255, 255, 255, 0.85); font-size: 1.5vw; font-weight: 700; font-family: 'Sarabun', sans-serif; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); z-index: 10; pointer-events: none;}

        .client-info-container { display: flex; align-items: stretch; width: 100%; }
        .client-info-box { 
            width: 100%; background-color: transparent; border: none; color: #ffffff; 
            font-family: 'Sarabun', sans-serif; font-size: 1.4vw; font-weight: bold; line-height: 1.5; resize: none; outline: none; 
        }
        .client-info-box::placeholder { color: rgba(255,255,255,0.6); }

        .dropdown-cell { background-color: #293A4B; border-radius: 50%; margin: 3px auto; display: flex; align-items: center; justify-content: center; height: 3vw; width: 3vw; box-sizing: border-box; }
        .number-dropdown { background: transparent; border: none; outline: none; cursor: pointer; font-family: 'Sarabun', sans-serif; font-weight: 700; font-size: 1.4vw; width: 100%; text-align: center; text-align-last: center; -webkit-appearance: none; appearance: none; }

        .custom-cell { background-color: #293A4B; border-radius: 8px; display: flex; align-items: center; justify-content: center; height: 3.5vw; box-sizing: border-box; transition: 0.3s;}
        
        .age-text-overlay { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -45%); 
            font-family: 'Sarabun', sans-serif; font-weight: 800; z-index: 8; pointer-events: none; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 2.0vw; width: 3.5vw; height: 3.5vw;    
        }
        .age-text-overlay.default { color: rgba(0, 0, 0, 0.65); text-shadow: 2px 2px 4px rgba(255,255,255,0.7), -1px -1px 2px rgba(255,255,255,0.7); }
        .age-text-overlay.danger { color: #d32f2f; text-shadow: 2px 2px 4px rgba(255,255,255,0.8), -1px -1px 2px rgba(255,255,255,0.8); }
        .age-text-overlay.danger-circle { border: 4px solid #d32f2f; border-radius: 50%; background-color: rgba(255,255,255,0.25); box-shadow: 0 0 10px rgba(211, 47, 47, 0.4); }
        .age-text-overlay.kalee-overlap { color: #ffffff; text-shadow: 2px 2px 6px rgba(0,0,0,0.9); }

        /* ========================================================== */
        /* 🛠️ แก้ไขสัญลักษณ์ ทักษาจร (เปลี่ยนกาลีเป็นระบบ CSS) */
        /* ========================================================== */
        .sri-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -45%); width: 40%; aspect-ratio: 1 / 1; background-color: rgba(46, 204, 113, 0.6); z-index: 5; pointer-events: none; border-radius: 8px; box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4); }
        
        .kalee-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -45%);
            width: 40%; height: auto; aspect-ratio: 1 / 1;
            border: none; background-color: rgba(231, 76, 60, 0.75);
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            z-index: 5; pointer-events: none;
        }
        .kalee-danger-circle { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -45%); 
            width: 55%; aspect-ratio: 1 / 1; 
            border: 4px solid rgba(192, 57, 43, 0.9); border-radius: 50%; 
            z-index: 6; pointer-events: none; 
            display: flex; align-items: center; justify-content: center; 
            background-color: rgba(231, 76, 60, 0.15); box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); 
        }
        .kalee-danger-circle .kalee-wrapper {
            position: static; transform: none;
            width: 73%; height: auto; aspect-ratio: 1 / 1;
            border: none; background-color: rgba(231, 76, 60, 0.75);
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            margin: 0;
        }
        /* ========================================================== */

        .age-button {
            margin: 5px auto 0 auto; width: 80%; height: 3vw; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; box-sizing: border-box;
            font-family: 'Sarabun', sans-serif; font-size: 1.6vw; font-weight: 900;
            padding: 0; line-height: 1; -webkit-appearance: none; appearance: none;
            cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease, outline 0.2s ease;
        }
        .age-button:hover { transform: translateY(-3px) scale(1.04); z-index: 24; box-shadow: 0 8px 18px rgba(0,0,0,0.35); }
        .age-button.is-selected { outline: 4px solid #3498db; outline-offset: 2px; box-shadow: 0 0 15px 5px rgba(52, 152, 219, 0.8); z-index: 25; }
        .age-button.is-current:not(.is-selected) { outline: 2px dashed rgba(52, 152, 219, 0.9); outline-offset: 2px; }
        .custom-cell[data-row="8"] { margin-bottom: 0px; margin-top: 5px; width: 80%; height: 3vw; margin-left: auto; margin-right: auto; border-radius: 8px; } 
        .custom-cell[data-row="9"] { margin-top: -10px; margin-bottom: 5px; }    

        .timeline-area-wrapper { grid-area: 10 / 2 / span 1 / span 12; margin-top: 0px; margin-bottom: 10px; }

        .manual-input { background: transparent; color: #293A4B; font-weight: 900; font-size: 1.6vw; border: none; outline: none; font-family: 'Sarabun', sans-serif; width: 100%; text-align: center; }

        .dim-target-graph { transition: all 0.4s ease; position: relative; }
        .grid-board.has-graph-highlight .dim-target-graph { opacity: 0.2; filter: grayscale(70%); }
        .grid-board.has-graph-highlight .dim-target-graph.highlighted { opacity: 1; filter: none; transform: scale(1.05); z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .click-to-highlight-graph { cursor: pointer; }
        .click-to-highlight-graph:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); z-index: 10;}
        .grid-board.has-graph-highlight .dim-target-graph.click-to-highlight-graph { pointer-events: auto; }

        .dim-target-seven { transition: all 0.4s ease; position: relative; }
        .grid-board.has-seven-highlight .dim-target-seven { opacity: 0.2; filter: grayscale(70%); }
        .grid-board.has-seven-highlight .dim-target-seven.highlighted { opacity: 1; filter: none; transform: scale(1.05); z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border-color: #f1c40f !important; }
        .click-to-highlight-seven { cursor: pointer; }
        .click-to-highlight-seven:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(241, 196, 15, 0.4); z-index: 10;}
        .grid-board.has-seven-highlight .dim-target-seven.click-to-highlight-seven { pointer-events: auto; }
        #main-app-view.seven-only-view .click-to-highlight-seven-group { cursor: pointer; }
        #main-app-view.seven-only-view .click-to-highlight-seven-group:hover {
            transform: translateY(-4px); box-shadow: 0 8px 20px rgba(241,196,15,0.36); z-index: 12;
        }
        #main-app-view.seven-only-view .card-item.seven-source-selected::before,
        #main-app-view.seven-only-view .card-item.seven-source-selected::after {
            content: ""; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); aspect-ratio: 1 / 1;
            border-radius: 50%; pointer-events: none; z-index: 28; box-sizing: border-box;
        }
        #main-app-view.seven-only-view .card-item.seven-source-selected::before {
            width: 90%; border: 3px solid #f1c40f;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 0 10px rgba(241,196,15,0.7);
        }
        #main-app-view.seven-only-view .card-item.seven-source-selected::after {
            width: 70%; border: 2px solid #fff3a3;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.38), 0 0 7px rgba(255,255,255,0.65);
        }

        .timeline-container { background: #fdfdfd; border-radius: 10px; border: 2px solid #bdc3c7; box-shadow: inset 0 2px 10px rgba(0,0,0,0.05); overflow: hidden;}
        .timeline-wrapper { width: 100%; padding: 50px 15px 30px 15px; box-sizing: border-box; }
        .timeline-track { display: flex; align-items: center; position: relative; width: 100%; height: 40px; justify-content: space-between; }
        .timeline-line { position: absolute; top: 50%; left: 0; right: 0; height: 3px; background: #bdc3c7; transform: translateY(-50%); z-index: 1; }
        .timeline-node { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 10px; z-index: 5;}
        .node-dot { width: 8px; height: 8px; background: #7f8c8d; border-radius: 50%; }
        .dot-alert { width: 16px; height: 16px; background: #e74c3c; border-radius: 50%; box-shadow: 0 0 8px rgba(231,76,60,0.6); }
        .circle-1 { position: absolute; width: 24px; height: 24px; border: 2px solid #e74c3c; border-radius: 50%; z-index: 2;}
        .circle-2 { position: absolute; width: 34px; height: 34px; border: 2px solid #c0392b; border-radius: 50%; z-index: 1;}
        .node-age { position: absolute; top: -45px; font-weight: 800; font-family: 'Sarabun', sans-serif; color: #c0392b; font-size: 1.2vw; text-shadow: 1px 1px 4px white; z-index: 20; }

        /* มุมมองเฉพาะระบบเลข 7 ตัว: ซ่อนส่วนกราฟชีวิตและจัดแถวที่เหลือขึ้นมาอุดพื้นที่ */
        #main-app-view.seven-only-view #age-cycle-setting-group,
        #main-app-view.seven-only-view #timeline-setting-group,
        #main-app-view.seven-only-view .btn-graph12,
        #main-app-view.seven-only-view #main-board .board-mode-controls,
        #main-app-view.seven-only-view #main-board .r5-filter-controls,
        #main-app-view.seven-only-view #main-board .seven-label-controls,
        #main-app-view.seven-only-view #main-board .card-item[data-row="5"],
        #main-app-view.seven-only-view #main-board .card-item[data-row="2"]:not([data-seven-slot]),
        #main-app-view.seven-only-view #main-board .card-item[data-row="3"]:not([data-seven-slot]),
        #main-app-view.seven-only-view #main-board .card-item[data-row="4"]:not([data-seven-slot]),
        #main-app-view.seven-only-view #main-board .dropdown-cell[data-row="6"],
        #main-app-view.seven-only-view #main-board .age-button[data-row="8"],
        #main-app-view.seven-only-view #main-board .custom-cell[data-row="8"],
        #main-app-view.seven-only-view #main-board .custom-cell[data-row="9"],
        #main-app-view.seven-only-view #main-board .timeline-area-wrapper {
            display: none !important;
        }
        #main-app-view.seven-only-view .input-action-group { grid-column: 4 / span 2; }
        #main-app-view.seven-only-view .save-controls .btn-db { grid-column: 1 / -1; }
        #main-app-view.seven-only-view #main-wrapper { overflow-x: auto; overflow-y: visible; }
        #main-app-view.seven-only-view #export-area { min-width: 1280px; }
        #main-app-view.seven-only-view #main-board .card-item[data-seven-slot] .pos-label {
            display: flex; align-items: center; justify-content: center;
            min-height: 1.35em; padding-left: 2px; padding-right: 2px;
            font-size: clamp(10px, 0.82vw, 15px); line-height: 1.2;
            white-space: nowrap; overflow: visible; word-break: keep-all;
        }
        #main-app-view.seven-only-view #main-board .card-item[data-seven-slot] {
            width: 115%; justify-self: center;
        }
        #main-app-view.seven-only-view #main-board .teacher-watermark {
            grid-area: 8 / 1 / span 1 / span 14 !important;
            text-align: center; margin-top: 0;
        }
        #main-app-view.seven-only-view #main-board .card-item[data-seven-slot="0"] { grid-column: 2 !important; }
        #main-app-view.seven-only-view #main-board .card-item[data-seven-slot="1"] { grid-column: 3 !important; }
        #main-app-view.seven-only-view #main-board .card-item[data-seven-slot="2"] { grid-column: 4 !important; }
        #main-app-view.seven-only-view #main-board .card-item[data-seven-slot="3"] { grid-column: 5 !important; }
        #main-app-view.seven-only-view #main-board .card-item[data-seven-slot="4"] { grid-column: 6 !important; }
        #main-app-view.seven-only-view #main-board .card-item[data-seven-slot="5"] { grid-column: 7 !important; }
        #main-app-view.seven-only-view #main-board .card-item[data-seven-slot="6"] { grid-column: 8 !important; }
        #main-app-view.seven-only-view #main-board .card-item[data-row="7"] { grid-row: 5 !important; }

        /* ความสัมพันธ์ระหว่างแถวปีนักษัตรกับไพ่ฐานเลข 7 ตัว */
        .seven-pair-anchor { display: none; }
        #main-app-view.seven-only-view #main-board .seven-pair-anchor {
            display: grid; place-items: center; align-self: end; justify-self: center;
            transform: translateY(calc(50% + 7.5px)); z-index: 29;
            width: max-content; height: 0; pointer-events: none;
        }
        .seven-pair-relationship {
            --pair-color: #3498db; --pair-dark: #156a9a;
            display: grid; place-items: center; gap: 2px;
            transition: opacity 0.35s ease, filter 0.35s ease, transform 0.35s ease;
        }
        .seven-pair-symbol {
            position: relative; display: grid; place-items: center;
            width: clamp(34px, 3.15vw, 50px); aspect-ratio: 1 / 1;
            border: clamp(2px, 0.2vw, 3px) solid #ffffff; border-radius: 50%;
            color: #ffffff; background: var(--pair-color);
            box-shadow: 0 0 0 3px var(--pair-dark), 0 4px 11px rgba(0,0,0,0.42);
        }
        .seven-pair-name {
            min-width: clamp(45px, 4.5vw, 67px); padding: 2px 4px 1px;
            border: 1px solid rgba(255,255,255,0.92); border-radius: 999px;
            color: #ffffff; background: var(--pair-dark);
            font-family: 'Sarabun', sans-serif; font-size: clamp(8px, 0.58vw, 10px);
            font-weight: 900; line-height: 1.05; text-align: center; white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.34);
        }
        .seven-pair-icon { position: relative; display: block; width: 64%; height: 64%; }
        .seven-pair-chevron-icon { display: block; width: 68%; height: 68%; overflow: visible; }
        .seven-pair-chevron-icon path {
            fill: none; stroke: #ffffff; stroke-width: 4.5;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .seven-pair-icon.plus::before, .seven-pair-icon.plus::after {
            content: ""; position: absolute; left: 50%; top: 50%;
            border-radius: 2px; background: #ffffff; transform: translate(-50%, -50%);
        }
        .seven-pair-icon.plus::before { width: 95%; height: 22%; }
        .seven-pair-icon.plus::after { width: 22%; height: 95%; }
        .seven-pair-icon.triangle-up::before, .seven-pair-icon.triangle-down::before {
            content: ""; position: absolute; left: 50%; transform: translateX(-50%);
            border-left: clamp(8px, 0.8vw, 13px) solid transparent;
            border-right: clamp(8px, 0.8vw, 13px) solid transparent;
        }
        .seven-pair-icon.triangle-up::before {
            top: 7%; border-bottom: clamp(16px, 1.55vw, 25px) solid #ffffff;
        }
        .seven-pair-icon.triangle-down::before {
            bottom: 7%; border-top: clamp(16px, 1.55vw, 25px) solid #ffffff;
        }
        .seven-pair-relationship.pair-self { --pair-color: #35a9e6; --pair-dark: #0875ad; }
        .seven-pair-relationship.pair-element { --pair-color: #59bce9; --pair-dark: #187da8; }
        .seven-pair-relationship.pair-friend { --pair-color: #36b56d; --pair-dark: #13763d; }
        .seven-pair-relationship.pair-power { --pair-color: #168fce; --pair-dark: #075d91; }
        .seven-pair-relationship.pair-enemy { --pair-color: #eb4c4c; --pair-dark: #a51f29; }
        .seven-pair-relationship.pair-power .seven-pair-symbol::after {
            content: ""; position: absolute; inset: 14%; border: 2px solid rgba(255,255,255,0.92); border-radius: 50%;
        }
        .grid-board.has-seven-highlight .seven-pair-relationship.highlighted {
            box-shadow: none; border-color: transparent !important; transform: scale(1.08); z-index: 31;
        }

        /* ฐาน 8–9: บล็อกละ 2 แถว ช่องชื่อกับตัวเลขอยู่ชิดกัน */
        .nine-base-block { display: none; }
        #main-app-view.seven-only-view #main-board .nine-base-block {
            display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
            grid-template-rows: auto; column-gap: 30px;
            min-width: 0; align-self: start;
        }
        .nine-base-position {
            width: 115%; min-width: 0; justify-self: center; box-sizing: border-box;
            display: grid; grid-template-rows: auto auto; row-gap: 4px;
            padding: 2px; border: 2px solid transparent; border-radius: 12px;
            transition: opacity 0.4s ease, filter 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
        }
        .nine-base-cell {
            width: 100%; min-width: 0; justify-self: center; box-sizing: border-box;
            align-items: center; justify-content: center; padding: 4px 3px;
            border-radius: 8px; font-family: 'Sarabun', sans-serif;
            display: flex;
            cursor: pointer; -webkit-appearance: none; appearance: none;
        }
        .nine-base-name {
            min-height: clamp(29px, 2.15vw, 37px); background: #d5d8dc;
            color: #111111; border: 1px solid #aeb6bf;
            font-size: clamp(9px, 0.74vw, 13px); font-weight: 800; line-height: 1;
            white-space: nowrap; overflow: hidden; text-overflow: clip;
            box-shadow: 0 2px 6px rgba(0,0,0,0.14);
        }
        .nine-base-name.is-danger { color: #c62828; }
        .nine-base-number {
            min-height: clamp(38px, 2.9vw, 50px); background: #e5e7e9; color: #111111;
            border: 1px solid #b3b6b7; font-family: 'Sarabun', sans-serif;
            font-size: clamp(20px, 1.65vw, 30px); font-weight: 900; line-height: 1;
            box-shadow: 0 3px 8px rgba(0,0,0,0.18);
        }
        .nine-base-number:hover, .nine-base-name:hover {
            transform: translateY(-1px); background: #f2f3f4; z-index: 20;
        }
        .grid-board.has-seven-highlight .nine-base-position.highlighted {
            border-color: #f1c40f !important;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.38), 0 0 10px rgba(241,196,15,0.7);
        }

        .seven-only-age-panel, .seven-only-topic-panel { display: none; }
        #main-app-view.seven-only-view #main-board .seven-only-age-panel {
            display: grid; grid-area: 2 / 1 / span 3 / span 1;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(6, clamp(28px, 2.2vw, 42px));
            gap: 5px; align-self: start; align-content: start;
            padding: 5px; border: 1px solid rgba(133,193,233,0.55); border-radius: 10px;
            background: rgba(234,242,248,0.12); box-sizing: border-box; z-index: 18;
        }
        .seven-only-age-button {
            width: 100%; height: 100%; min-width: 0; min-height: 0; padding: 2px 1px;
            border: 1px solid #85c1e9; border-radius: 7px;
            background: #eaf2f8; color: #1b4f72; cursor: pointer;
            font-family: 'Sarabun', sans-serif; font-size: clamp(10px, 0.78vw, 14px); font-weight: 900;
            transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
        }
        .seven-only-age-button:hover { transform: translateY(-1px); background: #d6eaf8; }
        .seven-only-age-button.is-current { box-shadow: inset 0 0 0 2px #f4d03f; }
        .seven-only-age-button.is-selected {
            background: #2471a3; color: #ffffff; border-color: #1a5276;
            outline: 2px solid #f4d03f; outline-offset: 1px;
        }
        .seven-only-age-message {
            grid-column: 1 / -1; align-self: center; padding: 5px 2px;
            color: #ffffff; font-family: 'Sarabun', sans-serif;
            font-size: 10px; font-weight: 700; line-height: 1.25; text-align: center;
        }

        #main-app-view.seven-only-view #main-board .seven-only-topic-panel {
            display: grid; grid-area: 2 / 9 / span 6 / span 2;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: repeat(22, minmax(0, 1fr));
            gap: 3px; align-self: stretch; align-content: stretch;
            width: min(100%, 160px); min-height: 0; padding: 0;
            border: none; border-radius: 0; background: transparent;
            box-sizing: border-box; justify-self: start; z-index: 18;
        }
        .seven-topic-button {
            width: 100%; height: auto; min-width: 0; min-height: 0; padding: 1px 6px;
            border: 1px solid rgba(44,62,80,0.18); border-radius: 6px;
            color: #273746; cursor: default; font-family: 'Sarabun', sans-serif;
            font-size: clamp(9px, 0.65vw, 12px); font-weight: 800;
            line-height: 1.1; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.12);
        }
        .seven-topic-group-1 { background: #e8dff5; }
        .seven-topic-group-2 { background: #d9eefc; }
        .seven-topic-group-3 { background: #dff3e4; }
        .seven-topic-group-4 { background: #f9dce7; }
        .seven-topic-group-5 { background: #fde7d6; }
        .seven-topic-group-6 { background: #f6d6d6; }
        .seven-topic-group-7 { background: #fff1c9; }
        .seven-topic-group-8 { background: #dcefed; }

        /* ========================================================================== */
        /* ========================== ฐานกราฟชีวิต 12 ใบ =========================== */
        /* ========================================================================== */
        .graph12-view {
            width: min(1500px, 98%); margin: 0 auto; padding: 18px;
            box-sizing: border-box; background: #ffffff; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center;
        }
        .graph12-view[hidden] { display: none !important; }
        .graph12-toolbar {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
            gap: 14px; margin-bottom: 18px; padding: 14px;
            background: #f8f9fa; border: 1px solid #e5e7e9; border-radius: 14px;
        }
        .graph12-toolbar-group { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .graph12-toolbar-label { color: #566573; font-weight: 800; font-size: 0.95rem; margin-right: 2px; }
        .graph12-action-button {
            border: none; border-radius: 9px; padding: 10px 18px; cursor: pointer;
            color: #ffffff; font-family: 'Sarabun', sans-serif; font-size: 1rem; font-weight: 800;
            box-shadow: 0 3px 8px rgba(0,0,0,0.16); transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .graph12-action-button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.2); }
        .graph12-back-button { background: #566573; }
        .graph12-save-button { background: #27ae60; }
        .graph12-age-toggle { background: #117864; }
        .graph12-age-toggle.is-hidden { background: #b71c1c; }
        .graph12-filter-button {
            min-width: 46px; height: 38px; padding: 0 12px; border-radius: 19px;
            border: 2px solid #ffffff; cursor: pointer; font-family: 'Sarabun', sans-serif;
            font-size: 0.95rem; font-weight: 800; color: #ffffff;
            box-shadow: 0 2px 7px rgba(0,0,0,0.22); opacity: 0.52;
            transition: opacity 0.2s ease, transform 0.2s ease, outline 0.2s ease;
        }
        .graph12-filter-button.good { background: #2471a3; }
        .graph12-filter-button.bad { background: #b71c1c; }
        .graph12-filter-button.reset { background: #566573; }
        .graph12-filter-button:hover, .graph12-filter-button.is-active { opacity: 1; transform: scale(1.06); }
        .graph12-filter-button.is-active { outline: 2px solid #d4ac0d; outline-offset: 2px; }

        .graph12-day-button {
            width: 42px; height: 42px; padding: 0; border-radius: 50%;
            border: 2px solid #ffffff; cursor: pointer; color: #ffffff;
            font-family: 'Sarabun', sans-serif; font-size: 0.86rem; font-weight: 900;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25); opacity: 0.24;
            filter: grayscale(42%); transition: opacity 0.2s ease, filter 0.2s ease, transform 0.2s ease, outline 0.2s ease;
        }
        .graph12-day-button:hover { opacity: 0.75; filter: none; transform: scale(1.08); }
        .graph12-day-button.is-active {
            opacity: 1; filter: none; transform: scale(1.08);
            outline: 3px solid #d4ac0d; outline-offset: 3px;
        }

        .graph12-capture {
            background: #ffffff; border: 1px dashed #d5d8dc; border-radius: 16px;
            padding: clamp(18px, 2.4vw, 34px); box-sizing: border-box;
        }
        .graph12-title { margin: 0; color: #8e44ad; font-family: 'Kanit', sans-serif; font-size: clamp(1.8rem, 3vw, 2.8rem); }
        .graph12-caption {
            margin: 6px 0 16px; color: #566573; font-size: clamp(1rem, 1.5vw, 1.25rem);
            font-weight: 700;
        }
        .graph12-age-controls {
            display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 6px; width: 100%; margin: 0 0 24px;
        }
        .graph12-age-button {
            min-width: 0; padding: 7px 2px; border: 1px solid #aeb6bf; border-radius: 8px;
            background: #f2f4f4; color: #34495e; cursor: pointer;
            font-family: 'Sarabun', sans-serif; font-size: clamp(0.76rem, 1vw, 0.98rem); font-weight: 800;
            transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, outline 0.2s ease;
        }
        .graph12-age-button:hover { transform: translateY(-2px); background: #d6eaf8; }
        .graph12-age-button.is-current { border-color: #d4ac0d; box-shadow: inset 0 0 0 2px #f7dc6f; }
        .graph12-age-button.is-selected {
            background: #2471a3; color: #ffffff; border-color: #1a5276;
            outline: 2px solid #d4ac0d; outline-offset: 2px;
        }
        .graph12-age-message {
            grid-column: 1 / -1; padding: 9px; border-radius: 8px;
            background: #fef9e7; color: #7d6608; font-weight: 700;
        }
        .graph12-layout {
            display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: clamp(12px, 1.6vw, 24px); width: 100%; position: relative;
        }
        .graph12-card {
            min-width: 0; padding: 7px; cursor: pointer;
            transition: opacity 0.35s ease, filter 0.35s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }
        .graph12-card .pos-label {
            font-size: clamp(0.8rem, 1.15vw, 1.15rem); margin-bottom: 7px; padding-bottom: 4px;
        }
        .graph12-card:hover { transform: translateY(-4px); z-index: 12; }
        .graph12-card.is-dimmed { opacity: 0.2 !important; filter: grayscale(70%) !important; }
        .graph12-card.has-age.is-dimmed { opacity: 0.5 !important; }
        .graph12-card.is-linked {
            opacity: 1 !important; filter: none !important; transform: scale(1.045);
            z-index: 15; outline: 3px solid #f1c40f; outline-offset: 3px;
            box-shadow: 0 8px 24px rgba(241,196,15,0.48) !important;
        }
        .graph12-link-badge {
            display: none; position: absolute; top: -11px; right: -11px;
            width: 30px; height: 30px; border-radius: 50%; align-items: center; justify-content: center;
            background: #f1c40f; color: #2c3e50; border: 2px solid #ffffff;
            font-size: 15px; z-index: 20; box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }
        .graph12-card.is-linkable .graph12-link-badge,
        .graph12-card.is-linked .graph12-link-badge { display: flex; }
        .graph12-age-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -38%);
            width: clamp(46px, 5.8vw, 82px); height: clamp(46px, 5.8vw, 82px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.38); color: #0b3954;
            border: 2px solid rgba(52,152,219,0.58);
            box-shadow: 0 3px 10px rgba(0,0,0,0.16);
            text-shadow: 0 1px 2px rgba(255,255,255,0.98), 0 0 6px rgba(255,255,255,0.95);
            font-family: 'Kanit', sans-serif; font-size: clamp(1.55rem, 2.7vw, 2.9rem); font-weight: 800;
            line-height: 1; z-index: 18; pointer-events: none;
        }

        .graph12-pos-D1 { grid-area: 1 / 4; }
        .graph12-pos-C2 { grid-area: 2 / 3; }
        .graph12-pos-E2 { grid-area: 2 / 5; }
        .graph12-pos-B3 { grid-area: 3 / 2; }
        .graph12-pos-D3 { grid-area: 3 / 4; }
        .graph12-pos-F3 { grid-area: 3 / 6; }
        .graph12-pos-A4 { grid-area: 4 / 1; }
        .graph12-pos-B4 { grid-area: 4 / 2; }
        .graph12-pos-C4 { grid-area: 4 / 3; }
        .graph12-pos-E4 { grid-area: 4 / 5; }
        .graph12-pos-F4 { grid-area: 4 / 6; }
        .graph12-pos-G4 { grid-area: 4 / 7; }

        @media (max-width: 760px) {
            .graph12-view { width: 100%; padding: 10px; }
            .graph12-capture { overflow-x: auto; }
            .graph12-layout, .graph12-age-controls { min-width: 720px; }
            .graph12-toolbar { align-items: stretch; }
            .graph12-toolbar-group { width: 100%; }
        }
        @media (max-width: 1100px) {
            .control-panel.has-actions { grid-template-columns: 1fr; }
            .save-controls { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: auto; }
            .save-controls .layout-scale-control { grid-column: auto; }
            #main-app-view.seven-only-view .save-controls { grid-template-columns: repeat(5, minmax(0, 1fr)); }
            #main-app-view.seven-only-view .save-controls .btn-db { grid-column: auto; }
        }
        @media (max-width: 760px) {
            .input-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .save-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, auto); }
            .save-controls .layout-scale-control { grid-column: auto; }
            #main-app-view.seven-only-view .input-action-group { grid-column: 1 / -1; }
            #main-app-view.seven-only-view .save-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            #main-app-view.seven-only-view .save-controls .btn-db { grid-column: 1 / -1; }
        }
        @media (max-width: 520px) {
            .input-grid, .save-controls { grid-template-columns: 1fr; }
            .save-controls { grid-template-rows: repeat(6, auto); }
            .save-controls .layout-scale-control { grid-column: 1; }
            #main-app-view.seven-only-view .save-controls { grid-template-columns: 1fr; grid-template-rows: repeat(5, auto); }
            #main-app-view.seven-only-view .save-controls .btn-db { grid-column: 1; }
            .input-section { padding: 12px; }
        }
    </style>
</head>
<body>

<div class="container" id="main-app-view">
    <h2 id="main-view-title">🔮 กระดานพยากรณ์ กราฟชีวิต & เลขเจ็ดตัว 9 ฐาน</h2>

    <div class="input-section">
        <div class="control-panel">
            <div class="input-grid">
            <div class="input-group">
                <label>1. วันที่เกิด</label>
                <select id="sel-date">
                    <option value="" disabled selected>-- เลือกวันที่ --</option>
                    <script>for(let i=1; i<=31; i++) document.write(`<option value="${400+i}">วันที่ ${i}</option>`);</script>
                </select>
            </div>
            <div class="input-group">
                <label>2. วันเกิด</label>
                <select id="sel-day">
                    <option value="" disabled selected>-- เลือกวัน --</option>
                    <option value="101">วันอาทิตย์ (1)</option>
                    <option value="102">วันจันทร์ (2)</option>
                    <option value="103">วันอังคาร (3)</option>
                    <option value="104">วันพุธ (4)</option>
                    <option value="105">วันพฤหัสบดี (5)</option>
                    <option value="106">วันศุกร์ (6)</option>
                    <option value="107">วันเสาร์ (7)</option>
                </select>
            </div>
            <div class="input-group">
                <label>3. เดือนเกิด</label>
                <select id="sel-month">
                    <option value="" disabled selected>-- เลือกเดือน --</option>
                    <option value="201">เดือน 1 (อ้าย) / ธันวาคม</option>
                    <option value="202">เดือน 2 (ยี่) / มกราคม</option>
                    <option value="203">เดือน 3 / กุมภาพันธ์</option>
                    <option value="204">เดือน 4 / มีนาคม</option>
                    <option value="205">เดือน 5 / เมษายน</option>
                    <option value="206">เดือน 6 / พฤษภาคม</option>
                    <option value="207">เดือน 7 / มิถุนายน</option>
                    <option value="208">เดือน 8 / กรกฎาคม</option>
                    <option value="209">เดือน 9 / สิงหาคม</option>
                    <option value="210">เดือน 10 / กันยายน</option>
                    <option value="211">เดือน 11 / ตุลาคม</option>
                    <option value="212">เดือน 12 / พฤศจิกายน</option>
                </select>
            </div>
            <div class="input-group">
                <label>4. ปีนักษัตร</label>

        target.style.transform = scale === 1 ? 'none' : `scale(${scale})`;
        const unscaledHeight = target.offsetHeight;
        if (!unscaledHeight) return;
        wrapper.style.height = scale === 1 ? '' : `${Math.ceil(unscaledHeight * scale)}px`;

    function prepareFullScaleCapture(targetId, wrapperId, displayScale) {
        const target = document.getElementById(targetId);

        target.style.transition = 'none';
        applyScaledLayout(targetId, wrapperId, 100);

    function generateSequence(startId, length, minId, maxId) {
        let seq = []; let curr = startId;
        for (let i = 0; i < length; i++) { seq.push(curr); curr++; if (curr > maxId) curr = minId; }
        return seq;
    }

    function reduceTo1To7(value) {
        return ((Number(value) - 1) % 7 + 7) % 7 + 1;
    }

    function sequence1To7(start) {
        return Array.from({ length: 7 }, (_, offset) => reduceTo1To7(Number(start) + offset));
    }

    function walkDaytimeYam(start) {
        const startIndex = DAYTIME_YAM_SEQUENCE.indexOf(Number(start));
        if (startIndex < 0) throw new Error(`เลขเริ่มต้นยามกลางวันไม่ถูกต้อง: ${start}`);
        return Array.from({ length: 7 }, (_, offset) => DAYTIME_YAM_SEQUENCE[(startIndex + offset) % 7]);
    }

    function calculateNineBaseCore(dayCode, monthCode, zodiacCode) {
        const daySeed = CARD_GROUPS[String(dayCode)];
        const monthSeed = CARD_GROUPS[String(monthCode)];
        const zodiacSeed = CARD_GROUPS[String(zodiacCode)];
        if (![daySeed, monthSeed, zodiacSeed].every(seed => Number.isInteger(seed) && seed >= 1 && seed <= 7)) {
            throw new Error('ไม่สามารถหาเลขตั้งต้นวัน เดือน หรือปีนักษัตรได้');
        }

        const base1 = sequence1To7(daySeed);
        const base2 = sequence1To7(monthSeed);
        const base3 = sequence1To7(zodiacSeed);
        const base4 = base1.map((value, index) => value + base2[index] + base3[index]);
        const base5 = base4.map(reduceTo1To7);
        const base6 = base5.map(value => reduceTo1To7(value * 2));
        const base7 = base6.map(value => reduceTo1To7(value * 2));
        const base8 = walkDaytimeYam(base5[0]);
        const start9 = reduceTo1To7(base5[6] + base8[6]);
        const base9 = walkDaytimeYam(start9).reverse();

        return {
            seeds: { daySeed, monthSeed, zodiacSeed },
            base1, base2, base3, base4, base5, base6, base7, base8, base9
        };
    }

    function verifyNineBaseGoldenTest() {

        const expectedBase8 = [6, 4, 2, 7, 5, 3, 1];

        const passed = JSON.stringify(result.base8) === JSON.stringify(expectedBase8)
            && JSON.stringify(result.base9) === JSON.stringify(expectedBase9);
        if (!passed) console.error('Nine-base golden test 7-5-1 failed', result);
        return passed;
    }

    function calculateDynamicPositions(arrayData, targetCode) {
        let splitIndex = arrayData.indexOf(targetCode);
        if(splitIndex === -1) splitIndex = 0; 
        let positions = [];
        if (splitIndex === 0 || splitIndex >= 7) { for(let i=0; i<7; i++) positions.push(i); } 
        else {
            for(let i=0; i<splitIndex; i++) positions.push(i);
            let remaining = 7 - splitIndex; let startRight = 12 - remaining;
            for(let i=0; i<remaining; i++) positions.push(startRight + i);
        }
        return positions;
    }

    function scan84YearsTimeline(data) {
        let alerts = [];
        const badTitles = ["ความเสื่อม", "ศัตรู", "สูญเสีย", "โรคภัย"];
        const hasRahuCard = data.SEVEN_BASE.some(code => code === "408" || code === "412");
        let path9 = [1, 5, 2, 3, 4, 7, 5, 8, 6]; 
        let path8 = [1, 2, 3, 4, 7, 5, 8, 6];
        let startDayNum = parseInt(data.DAY[0]) % 100;
        
        // 🛠️ แก้ไข: วันพฤหัสบดี (5) ให้เริ่มที่ตำแหน่ง 5 ตัวที่ 2 (index 6)
        let startIndex9 = (startDayNum === 5) ? path9.lastIndexOf(5) : path9.indexOf(startDayNum);

        const get21HousePoint = (age) => {
            let targetIdx21 = (age - 1) % 21;
            if (targetIdx21 < 7) {
                return { title: ROW_2_TITLES[targetIdx21], code: data.DAY[targetIdx21] };
            }
            if (targetIdx21 < 14) {
                let posIdx = targetIdx21 - 7;
                return { title: ROW_4_TITLES[posIdx], code: data.MONTH[data.posMonth[posIdx]] };
            }
            let posIdx = targetIdx21 - 14;
            return { title: ROW_6_TITLES[posIdx], code: data.YEAR[data.posYear[posIdx]] };
        };

        // กลุ่มดาวที่วางอยู่ใน 4 ตำแหน่งเสียของระบบ 21 ภพ
        const bad21HouseGroups = new Set();
        ROW_2_TITLES.forEach((title, index) => {
            if (badTitles.includes(title)) bad21HouseGroups.add(CARD_GROUPS[data.DAY[index]]);
        });
        ROW_4_TITLES.forEach((title, index) => {
            if (badTitles.includes(title)) bad21HouseGroups.add(CARD_GROUPS[data.MONTH[data.posMonth[index]]]);
        });
        ROW_6_TITLES.forEach((title, index) => {
            if (badTitles.includes(title)) bad21HouseGroups.add(CARD_GROUPS[data.YEAR[data.posYear[index]]]);
        });
        bad21HouseGroups.delete(undefined);

        // กลุ่มดาวที่วางอยู่ในตำแหน่งวาสนาและตัวเราของระบบ 21 ภพ
        const core21HouseGroups = new Set();
        ROW_2_TITLES.forEach((title, index) => {
            if (title === "วาสนา" || title === "ตัวเรา") core21HouseGroups.add(CARD_GROUPS[data.DAY[index]]);
        });
        ROW_4_TITLES.forEach((title, index) => {
            if (title === "วาสนา" || title === "ตัวเรา") core21HouseGroups.add(CARD_GROUPS[data.MONTH[data.posMonth[index]]]);
        });
        ROW_6_TITLES.forEach((title, index) => {
            if (title === "วาสนา" || title === "ตัวเรา") core21HouseGroups.add(CARD_GROUPS[data.YEAR[data.posYear[index]]]);
        });
        core21HouseGroups.delete(undefined);

        for(let age = 1; age <= 84; age++) {
            let graphIdx = (age - 1) % 12;
            let graphStatus = getCardBaseStatus(data.GRAPH_BASE[graphIdx]);
            let graphIsBad = (graphStatus === "B" || graphStatus === "VB");
            let graphTitle = ROW_8_TITLES[graphIdx];
            let graphAtDangerPosition = (graphTitle === "ศัตรู" || graphTitle === "โรคภัย");
            let graphMeetsLevel1 = graphIsBad || graphAtDangerPosition;

            let sevenIdx = (age - 1) % 7;
            let sevenStatus = getCardBaseStatus(data.SEVEN_BASE[sevenIdx]);
            let sevenIsBad = (sevenStatus === "B" || sevenStatus === "VB");

            // ระดับ 1: R5 เป็นไพ่ร้าย/ร้ายมากหรือตกศัตรู/โรคภัย และ R7 เป็นไพ่ร้าย/ร้ายมาก
            if (!graphMeetsLevel1 || !sevenIsBad) continue;

            let point21 = get21HousePoint(age);
            let ageAtBad21HousePosition = badTitles.includes(point21.title);
            let age21Group = CARD_GROUPS[point21.code];

            let boriwanNum = path9[(startIndex9 + age - 1) % 9];
            let startIndex8 = path8.indexOf(boriwanNum);
            let kaleeNum = path8[(startIndex8 + 7) % 8];

            let kaleeAtBad21HousePosition = bad21HouseGroups.has(kaleeNum);
            let kaleeAt21HouseAge = age21Group === kaleeNum;
            let kaleeAtRahuCard = kaleeNum === 8 && hasRahuCard;
            let hasLevel2KaleeCondition = kaleeAtBad21HousePosition || kaleeAt21HouseAge || kaleeAtRahuCard;
            let kaleeAtCore21HousePosition = core21HouseGroups.has(kaleeNum);

            // ระดับ 2: ผ่านระดับ 1 + (อายุตกตำแหน่งเสียใน 21 ภพ หรือกาลีเข้าอย่างน้อย 1 เงื่อนไข)
            let meetsLevel2 = ageAtBad21HousePosition || hasLevel2KaleeCondition;
            let level = 1;
            // ระดับ 3: ผ่านระดับ 2 และกาลีตรงตำแหน่งวาสนาหรือตัวเราในระบบ 21 ภพ
            if (meetsLevel2) level = kaleeAtCore21HousePosition ? 3 : 2;
            alerts.push({ age: age, level: level });
        }
        return alerts;
    }

    function generateAndRender() {
        const valDate = parseInt(document.getElementById('sel-date').value);
        const valDay = parseInt(document.getElementById('sel-day').value);
        const valMonth = document.getElementById('sel-month').value;
        const valYear = parseInt(document.getElementById('sel-year').value);
        const birthYear = parseInt(document.getElementById('birth-be-year').value);
        
        const ageMode = parseInt(document.getElementById('sel-age-mode').value);
        const zodiacMode = parseInt(document.getElementById('sel-zodiac-row').value);
        const taksaMode = parseInt(document.getElementById('sel-taksa').value);
        const timelineMode = parseInt(document.getElementById('sel-timeline').value);

        if (!valDate || !valDay || !valMonth || !valYear) { alert("กรุณาเลือกข้อมูลให้ครบครับ"); return; }

        let age = 0;
        if (birthYear > 2400) {
            const birthDayNum = valDate - 400; 
            const birthMonthNum = MONTH_CALENDAR_MAP[valMonth]; 
            const today = new Date();
            const currentYearBE = today.getFullYear() + 543;
            const currentMonthNum = today.getMonth() + 1; 
            const currentDayNum = today.getDate();
            age = currentYearBE - birthYear; 
            if (currentMonthNum < birthMonthNum || (currentMonthNum === birthMonthNum && currentDayNum < birthDayNum)) { age--; }
        }

        const daySeq = generateSequence(valDay, 7, 101, 107);
        const monthSeq = generateSequence(parseInt(valMonth), 12, 201, 212);
        const yearSeq = generateSequence(valYear, 12, 301, 312);
        const nineBases = calculateNineBaseCore(valDay, parseInt(valMonth), valYear);

        let graphBase = []; let usedGraphCards = new Set();
        for (let i = 0; i < 12; i++) {
            let dVal = (i < 7) ? (daySeq[i] % 100) : 0; 
            let mVal = monthSeq[i] % 100; let yVal = yearSeq[i] % 100;
            let sum = dVal + mVal + yVal; let targetCard = 400 + sum;
            if (usedGraphCards.has(targetCard)) {
                let groupId = sum % 12 || 12; let groupCards = GRAPH_GROUPS[groupId];
                let availableCards = groupCards.filter(c => !usedGraphCards.has(c));
                if (availableCards.length > 0) targetCard = availableCards[0];
            }
            usedGraphCards.add(targetCard); graphBase.push(targetCard);
        }

        let sevenBase = [];
        let posMonth = calculateDynamicPositions(monthSeq, 201);
        let posYear = calculateDynamicPositions(yearSeq, 301);
        for (let i = 0; i < 7; i++) {
            let dVal = daySeq[i] % 100; 
            let mIdx = posMonth[i]; let mVal = ((monthSeq[mIdx] - 201) % 7) + 1; 
            let yIdx = posYear[i]; let yVal = ((yearSeq[yIdx] - 301) % 7) + 1;
            sevenBase.push(400 + (dVal + mVal + yVal));
        }

        activeR5Filter = null;
        graphHighlightMode = "vertical";
        sevenLabelsVisible = true;
        buildBoardUI({
            DATE: [valDate.toString()], DAY: daySeq.map(String), MONTH: monthSeq.map(String), posMonth: posMonth,
            YEAR: yearSeq.map(String), posYear: posYear, GRAPH_BASE: graphBase.map(String), SEVEN_BASE: sevenBase.map(String),
            NINE_BASES: nineBases,
            AGE: age, BASE_AGE: age, SELECTED_AGE: age,
            AGE_MODE: ageMode, ZODIAC_MODE: zodiacMode, TAKSA_MODE: taksaMode, TIMELINE_MODE: timelineMode
        });
    }

        document.querySelectorAll('.r5-filter-button').forEach(button => {

    function createGraphGuideSvgElement(tagName, attributes = {}) {
        const element = document.createElementNS('http://www.w3.org/2000/svg', tagName);
        Object.entries(attributes).forEach(([name, value]) => element.setAttribute(name, String(value)));
        return element;
    }

    function removeGraphDiagonalGuides() {
